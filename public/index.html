<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f5f6f8; margin: 0; padding: 0 16px 80px; color: #1f1f1f;
  }
  nav {
    max-width: 1000px; margin: 0 auto; display: flex; gap: 6px; flex-wrap: wrap;
    padding: 20px 0 8px; justify-content: center;
  }
  nav a {
    text-decoration: none; color: #444; font-size: 14px; padding: 8px 14px;
    border-radius: 8px; background: #fff; border: 1px solid #e5e5e5;
  }
  nav a.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  h1 { text-align: center; margin-bottom: 4px; }
  p.subtitle { text-align: center; color: #6b6b6b; margin-top: 0; }

  .stats-grid {
    max-width: 1000px; margin: 24px auto; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px;
  }
  .stat-card {
    background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px;
    text-align: center;
  }
  .stat-card .value { font-size: 28px; font-weight: 700; color: #2563eb; }
  .stat-card.warn .value { color: #dc2626; }
  .stat-card .label { font-size: 13px; color: #6b6b6b; margin-top: 4px; }

  .section-title { max-width: 1000px; margin: 32px auto 8px; font-size: 16px; font-weight: 600; }
  .quick-links { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 14px; }
  .quick-links a {
    display: block; background: #fff; border: 1px solid #e5e5e5; border-radius: 12px;
    padding: 18px; text-decoration: none; color: #1f1f1f;
  }
  .quick-links a strong { display: block; margin-bottom: 4px; }
  .quick-links a span { font-size: 13px; color: #6b6b6b; }
  .error-msg { max-width: 1000px; margin: 24px auto; text-align: center; color: #dc2626; }
</style>
</head>
<body>
  <nav>
    <a href="index.html" class="active">Dashboard</a>
    <a href="books.html">Books</a>
    <a href="authors.html">Authors</a>
    <a href="members.html">Members</a>
    <a href="issues.html">Issue / Return</a>
    <a href="reports.html">Reports</a>
  </nav>

  <h1>Library Management System</h1>
  <p class="subtitle">A quick look at where things stand</p>

  <div class="stats-grid" id="statsGrid"></div>
  <div class="error-msg" id="errorMsg" style="display:none;"></div>

  <div class="section-title">Quick actions</div>
  <div class="quick-links">
    <a href="book_form.html"><strong>+ Add a book</strong><span>Add a new title to the catalog</span></a>
    <a href="member_form.html"><strong>+ Add a member</strong><span>Register a new library member</span></a>
    <a href="issues.html"><strong>Issue a book</strong><span>Lend a book to a member</span></a>
    <a href="reports.html"><strong>View overdue report</strong><span>See who owes late fees</span></a>
  </div>

  <script>
    const API_BASE = "http://localhost:3000";
    async function loadStats() {
      const grid = document.getElementById("statsGrid");
      const errorMsg = document.getElementById("errorMsg");
      try {
        const res = await fetch(`${API_BASE}/reports/summary`);
        if (!res.ok) throw new Error(`Server responded with status ${res.status}`);
        const { data } = await res.json();

        grid.innerHTML = `
          <div class="stat-card"><div class="value">${data.total_book_titles}</div><div class="label">Book titles</div></div>
          <div class="stat-card"><div class="value">${data.available_copies}/${data.total_copies}</div><div class="label">Copies available</div></div>
          <div class="stat-card"><div class="value">${data.total_members}</div><div class="label">Members</div></div>
          <div class="stat-card"><div class="value">${data.currently_issued}</div><div class="label">Currently issued</div></div>
          <div class="stat-card ${data.currently_overdue > 0 ? 'warn' : ''}"><div class="value">${data.currently_overdue}</div><div class="label">Overdue</div></div>
        `;
      } catch (err) {
        errorMsg.textContent = "Could not load dashboard stats: " + err.message;
        errorMsg.style.display = "block";
      }
    }
    window.addEventListener("DOMContentLoaded", loadStats);
  </script>
</body>
</html>
