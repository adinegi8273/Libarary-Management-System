<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authors - Library</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f5f6f8; margin: 0; padding: 0 16px 80px; color: #1f1f1f; }
  nav { max-width: 1000px; margin: 0 auto; display: flex; gap: 6px; flex-wrap: wrap; padding: 20px 0 8px; justify-content: center; }
  nav a { text-decoration: none; color: #444; font-size: 14px; padding: 8px 14px; border-radius: 8px; background: #fff; border: 1px solid #e5e5e5; }
  nav a.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  h1 { text-align: center; margin-bottom: 4px; }
  p.subtitle { text-align: center; color: #6b6b6b; margin-top: 0; }
  .toolbar { max-width: 800px; margin: 24px auto 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  input, button { font-size: 14px; padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; background: #fff; }
  button { cursor: pointer; border: none; background: #2563eb; color: #fff; font-weight: 500; }
  button.secondary { background: #fff; color: #333; border: 1px solid #ddd; }
  button.danger { background: #dc2626; }
  .table-wrapper { max-width: 800px; margin: 0 auto; background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: #fafafa; }
  th { text-align: left; padding: 12px 16px; font-weight: 500; color: #6b6b6b; font-size: 12px; }
  td { padding: 12px 16px; border-top: 1px solid #eee; font-size: 14px; }
  .actions { display: flex; gap: 6px; }
  .actions button { padding: 6px 10px; font-size: 12px; }
  .empty, .error-msg { max-width: 800px; margin: 24px auto; text-align: center; color: #888; }
  .error-msg { color: #dc2626; }
  .pagination { max-width: 800px; margin: 16px auto; display: flex; justify-content: center; align-items: center; gap: 12px; color: #444; font-size: 14px; }
</style>
</head>
<body>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="books.html">Books</a>
    <a href="authors.html" class="active">Authors</a>
    <a href="members.html">Members</a>
    <a href="issues.html">Issue / Return</a>
    <a href="reports.html">Reports</a>
  </nav>
  <h1>Authors</h1>
  <p class="subtitle">Manage the authors linked to your books</p>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search by name or nationality" style="flex:1;" />
    <button id="addBtn">+ Add Author</button>
  </div>

  <div class="table-wrapper">
    <table>
      <thead><tr><th>Name</th><th>Nationality</th><th style="width:150px;">Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="empty" id="emptyMsg" style="display:none;">No authors found.</div>
  <div class="error-msg" id="errorMsg" style="display:none;"></div>
  <div class="pagination" id="pagination"></div>

  <script>
    const API_BASE = "http://localhost:3000";
    let state = { page: 1, limit: 10, search: "" };
    let debounceTimer;
    function escapeHtml(s){ return s==null?"":String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"); }

    async function loadAuthors() {
      const params = new URLSearchParams({ page: state.page, limit: state.limit, search: state.search });
      const errorMsg = document.getElementById("errorMsg"), emptyMsg = document.getElementById("emptyMsg"), tbody = document.getElementById("rows");
      errorMsg.style.display = "none"; emptyMsg.style.display = "none"; tbody.innerHTML = "";
      try {
        const res = await fetch(`${API_BASE}/authors?${params.toString()}`);
        if (!res.ok) throw new Error(`Server responded with status ${res.status}`);
        const result = await res.json();
        if (!result.data.length) { emptyMsg.style.display = "block"; }
        else {
          result.data.forEach(a => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${escapeHtml(a.name)}</td>
              <td>${escapeHtml(a.nationality || "-")}</td>
              <td class="actions">
                <button class="secondary" onclick="window.location.href='author_form.html?id=${a.id}'">Edit</button>
                <button class="danger" onclick="deleteAuthor(${a.id})">Delete</button>
              </td>`;
            tbody.appendChild(tr);
          });
        }
        renderPagination(result.pagination);
      } catch (err) {
        errorMsg.textContent = "Could not load authors: " + err.message;
        errorMsg.style.display = "block";
      }
    }
    function renderPagination(p) {
      const el = document.getElementById("pagination");
      if (!p) { el.innerHTML = ""; return; }
      el.innerHTML = `
        <button class="secondary" ${p.page <= 1 ? "disabled" : ""} onclick="changePage(${p.page - 1})">Prev</button>
        <span>Page ${p.page} of ${p.totalPages} (${p.total} authors)</span>
        <button class="secondary" ${p.page >= p.totalPages ? "disabled" : ""} onclick="changePage(${p.page + 1})">Next</button>`;
    }
    function changePage(page) { state.page = page; loadAuthors(); }
    async function deleteAuthor(id) {
      if (!confirm("Delete this author?")) return;
      try {
        const res = await fetch(`${API_BASE}/authors/${id}`, { method: "DELETE" });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || `Server responded with status ${res.status}`);
        loadAuthors();
      } catch (err) { alert("Failed to delete author: " + err.message); }
    }
    document.getElementById("searchInput").addEventListener("input", e => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => { state.search = e.target.value; state.page = 1; loadAuthors(); }, 300);
    });
    document.getElementById("addBtn").addEventListener("click", () => window.location.href = "author_form.html");
    window.addEventListener("DOMContentLoaded", loadAuthors);
  </script>
</body>
</html>
