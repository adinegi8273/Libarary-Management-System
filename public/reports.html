<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports - Library</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f5f6f8; margin: 0; padding: 0 16px 80px; color: #1f1f1f; }
  nav { max-width: 1000px; margin: 0 auto; display: flex; gap: 6px; flex-wrap: wrap; padding: 20px 0 8px; justify-content: center; }
  nav a { text-decoration: none; color: #444; font-size: 14px; padding: 8px 14px; border-radius: 8px; background: #fff; border: 1px solid #e5e5e5; }
  nav a.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  h1 { text-align: center; margin-bottom: 4px; }
  p.subtitle { text-align: center; color: #6b6b6b; margin-top: 0; }

  .section { max-width: 1000px; margin: 28px auto; }
  .section h2 { font-size: 16px; margin-bottom: 10px; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
  .stat-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 18px; text-align: center; }
  .stat-card .value { font-size: 24px; font-weight: 700; color: #2563eb; }
  .stat-card.warn .value { color: #dc2626; }
  .stat-card .label { font-size: 12px; color: #6b6b6b; margin-top: 4px; }

  .table-wrapper { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: #fafafa; }
  th { text-align: left; padding: 12px 16px; font-weight: 500; color: #6b6b6b; font-size: 12px; }
  td { padding: 12px 16px; border-top: 1px solid #eee; font-size: 14px; }
  .fee { color: #dc2626; font-weight: 600; }
  .empty { text-align: center; color: #888; padding: 20px; }
  .error-msg { color: #dc2626; text-align: center; }
</style>
</head>
<body>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="books.html">Books</a>
    <a href="authors.html">Authors</a>
    <a href="members.html">Members</a>
    <a href="issues.html">Issue / Return</a>
    <a href="reports.html" class="active">Reports</a>
  </nav>
  <h1>Reports</h1>
  <p class="subtitle">Overdue items, late fees, and library-wide stats</p>

  <div class="section">
    <h2>Summary</h2>
    <div class="stats-grid" id="summaryGrid"></div>
  </div>

  <div class="section">
    <h2>Overdue books &amp; late fees</h2>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Book</th><th>Member</th><th>Due date</th><th>Days overdue</th><th>Estimated late fee</th></tr></thead>
        <tbody id="overdueRows"></tbody>
      </table>
      <div class="empty" id="overdueEmpty" style="display:none;">Nothing overdue right now 🎉</div>
    </div>
  </div>

  <div class="section">
    <h2>Most borrowed books</h2>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Book</th><th>Times borrowed</th></tr></thead>
        <tbody id="mostBorrowedRows"></tbody>
      </table>
      <div class="empty" id="mostBorrowedEmpty" style="display:none;">No borrowing history yet.</div>
    </div>
  </div>

  <div class="error-msg" id="errorMsg" style="display:none;"></div>

  <script>
    const API_BASE = "http://localhost:3000";
    function escapeHtml(s){ return s==null?"":String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"); }

    async function loadSummary() {
      const res = await fetch(`${API_BASE}/reports/summary`);
      if (!res.ok) throw new Error(`summary: ${res.status}`);
      const { data } = await res.json();
      document.getElementById("summaryGrid").innerHTML = `
        <div class="stat-card"><div class="value">${data.total_book_titles}</div><div class="label">Book titles</div></div>
        <div class="stat-card"><div class="value">${data.available_copies}/${data.total_copies}</div><div class="label">Copies available</div></div>
        <div class="stat-card"><div class="value">${data.total_members}</div><div class="label">Members</div></div>
        <div class="stat-card"><div class="value">${data.currently_issued}</div><div class="label">Currently issued</div></div>
        <div class="stat-card ${data.currently_overdue > 0 ? 'warn' : ''}"><div class="value">${data.currently_overdue}</div><div class="label">Overdue</div></div>
      `;
    }

    async function loadOverdue() {
      const res = await fetch(`${API_BASE}/reports/overdue`);
      if (!res.ok) throw new Error(`overdue: ${res.status}`);
      const { data } = await res.json();
      const tbody = document.getElementById("overdueRows");
      const empty = document.getElementById("overdueEmpty");
      tbody.innerHTML = "";
      if (!data.length) { empty.style.display = "block"; return; }
      empty.style.display = "none";
      data.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(r.book_title)}</td>
          <td>${escapeHtml(r.member_name)} <span style="color:#999;">(${escapeHtml(r.member_email)})</span></td>
          <td>${r.due_date.slice(0,10)}</td>
          <td>${r.days_overdue}</td>
          <td class="fee">${r.estimated_late_fee}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function loadMostBorrowed() {
      const res = await fetch(`${API_BASE}/reports/most-borrowed?limit=5`);
      if (!res.ok) throw new Error(`most-borrowed: ${res.status}`);
      const { data } = await res.json();
      const tbody = document.getElementById("mostBorrowedRows");
      const empty = document.getElementById("mostBorrowedEmpty");
      tbody.innerHTML = "";
      if (!data.length) { empty.style.display = "block"; return; }
      empty.style.display = "none";
      data.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${escapeHtml(r.title)}</td><td>${r.times_borrowed}</td>`;
        tbody.appendChild(tr);
      });
    }

    window.addEventListener("DOMContentLoaded", async () => {
      try {
        await Promise.all([loadSummary(), loadOverdue(), loadMostBorrowed()]);
      } catch (err) {
        document.getElementById("errorMsg").textContent = "Could not load reports: " + err.message;
        document.getElementById("errorMsg").style.display = "block";
      }
    });
  </script>
</body>
</html>
